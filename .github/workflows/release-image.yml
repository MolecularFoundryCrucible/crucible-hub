name: Release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/molecularfoundrycrucible/crucible-hub
  PUBLISH: ${{ github.ref_type == 'tag' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx create --use --driver docker-container
          version="${REF_NAME#v}"
          api_revision="$(jq -r .sourceRevision contracts/crucible-api.lock.json)"
          if [ "$PUBLISH" = true ]; then
            output="type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
          else
            output="type=cacheonly"
          fi
          docker buildx build . \
            --platform "$PLATFORM" \
            --build-arg "VITE_APP_VERSION=$REF_NAME" \
            --build-arg "VITE_GIT_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.title=Crucible Hub" \
            --label "org.opencontainers.image.description=Web workspace for the Crucible scientific data platform" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=$(jq -r '.license // empty' package.json)" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "gov.lbl.crucible.api.revision=$api_revision" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file metadata.json \
            --output "$output"
          mkdir -p digests
          if [ "$PUBLISH" = true ]; then
            digest="$(jq -r '."containerimage.digest"' metadata.json)"
            touch "digests/${digest#sha256:}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Publish the multi-architecture tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="${REF_NAME#v}"
          sources=()
          for digest in digests/*; do sources+=("$IMAGE@sha256:$(basename "$digest")"); done
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:${version%.*}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
