name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crucible_hub
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crucible_hub"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      HUB_TEST_SESSION_DATABASE_URL: postgres://crucible_hub_app:app@127.0.0.1:5432/crucible_hub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-session-test-database.mjs
        env:
          HUB_TEST_SESSION_ADMIN_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/crucible_hub
      - run: npm run validate:static
      - run: npm run audit
      - run: npm run skills:list
      - run: npm run skills:stale

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
