steps:
  - id: build-deps
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --target
      - deps
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - ${_IMAGE}:deps-cache
      - --tag
      - ${_IMAGE}:deps-cache
      - .
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - ${_IMAGE}:deps-cache
      - --build-arg
      - VITE_GIT_COMMIT=${_IMAGE_TAG}
      - --tag
      - ${_IMAGE}:${_IMAGE_TAG}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_IMAGE}
  - id: digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        digest=$(gcloud artifacts docker images describe \
          "${_IMAGE}:${_IMAGE_TAG}" --format='value(image_summary.digest)')
        echo "Image: ${_IMAGE}@$${digest}"
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/crucible-hub/app
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
