steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_IMAGE}:${COMMIT_SHA}
      - --tag
      - ${_IMAGE}:${TAG_NAME}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, ${_IMAGE}]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        digest=$(gcloud artifacts docker images describe \
          "${_IMAGE}:${COMMIT_SHA}" --format='value(image_summary.digest)')
        gcloud run deploy ${_SERVICE} --project $PROJECT_ID \
          --region ${_REGION} --image "${_IMAGE}@$${digest}" --quiet
substitutions:
  _REGION: us-central1
  _SERVICE: crucible-hub
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/crucible-hub/app
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
